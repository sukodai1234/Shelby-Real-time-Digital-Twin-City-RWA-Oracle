name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
  shelby-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shelby-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shelby-bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  move:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @aptos-labs/aptos-cli@3.0.0 move test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shelby-rwa-oracle:test .
      - run: docker build -t shelby-rwa-bridge:test ./shelby-bridge
